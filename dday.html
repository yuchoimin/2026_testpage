<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Day 계산기 | 최유민 · Midnight Aurora</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="practice.css">
  <script src="practice.js"></script>
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="site-shell">
    <nav class="topbar" aria-label="주 메뉴">
      <a class="brand" href="index.html"><span class="brand-symbol">✳</span> YUMIN<span class="brand-dot">.</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html" class="active">Portfolio</a>
        <a href="contact.html">Contact</a>
      </div>
      <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">☰</button>
    </nav>

    <header class="page-heading practice-heading">
      <a class="text-link" href="portfolio.html#practice-heading">← 11주차 실습 목록</a>
      <h1><span class="gradient-text">D-Day</span> 계산기</h1>
      <p class="lead">목표일까지 며칠 남았는지 확인해 보세요.</p>
    </header>

    <main class="practice-grid" id="main-content">
      <section class="glass practice-panel" aria-labelledby="settings-heading">
        <h2 id="settings-heading">날짜 설정</h2>
        <p id="dday-today"></p>
        <form class="practice-form" id="dday-form">
          <label for="target-date">목표 날짜</label>
          <div class="practice-controls">
            <input type="date" id="target-date" min="1000-01-01" max="9999-12-31" required>
            <button class="btn primary" type="submit">계산하기</button>
          </div>
        </form>
      </section>
      <section class="glass practice-panel practice-result" aria-labelledby="result-heading">
        <h2 id="result-heading">실행 결과</h2>
        <div role="status" aria-atomic="true">
          <script>
            const today = new Date();
            const initialDday = calculateDday(readDatePrompts(today), today);
            writeInitialResult(initialDday);
            mountDday(initialDday, today);
          </script>
          <noscript>JavaScript를 켜면 결과를 확인할 수 있어요.</noscript>
        </div>
      </section>
    </main>

    <footer>
      <div><strong>YUMIN<span class="brand-dot">.</span></strong> <span>Building, learning, exploring.</span></div>
      <small>© <span id="year">2026</span> 최유민 · Made with HTML, CSS &amp; JavaScript</small>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
